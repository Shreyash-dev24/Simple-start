<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .nav{
            top: 0;
            position: sticky;
        }
        .nav ul {
            display: flex;
            background-color: pink;
            margin-top: 0;
            position: sticky;
            font-size: 30px;
    

        }
        ul li {
            padding: 23px;
            list-style-type: none;
            position: sticky;
    
        }
        .box{
            border: 2px solid black;
            width: 94%;
            height: 580px;
            display: flex;
            margin-left: 33px;
            margin-top: 30px;
        }
        .box1 {
            border: 2px solid black;
            padding: 40px;
            margin: 45px;
            width: 400px;
            height: 400px;

        }
        .box2 {
            
            margin-left: 60px;

            width: 400px;
            height: 400px;
            border: 2px solid black;
            padding: 40px;
        }
        .box3{
            border: 2px solid black;
            width: 800px;
            height: 200px;
            margin: 60px;
            margin-left: 200px;
            border-radius: 20%;
            margin-top: 20px;
            text-align: center;
            font-size: 55px;
        }
        footer{
            background-color: pink;
            text-align: center;
            margin-top:10px;
            font-size: 40px;
        }
        .circle{
            background-color: black;
            border: 2px solid black;
            border-radius: 100px;
            height: 50px;
            width: 50px;
            margin-left: 900px;
            position: sticky;
        }
    </style>
</head>

<body>
    <div class="nav">
        <ul>
            <li>Home </li>
            <li>About </li>
            <li>Contact Us </li>
            <li>Services </li>
        </ul>
    </div>
    <div class="box">
       <div class="box1">box1</div>
       <div class="box2">box2</div>
    </div>
    <div class="box3">

        <p>Welcome to this Sigma Web Development Course</p>
