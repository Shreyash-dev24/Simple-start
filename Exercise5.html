<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 5</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }

      nav {
        background-color: rgb(226, 104, 226);
        display:flex;
        position: sticky;
        top: 0;
      }

      nav ul li {
        display: inline-flex;
        padding: 10px;
        margin-top: 5px;
      }
      .box{
        display: flex;
        border: 2px solid black;
        width:740px ;
        margin:10px 10px;
        height: 300px;
      }
      .box1 {
        border: 2px solid black;
        width: 310px;
        height: 240px;
        margin:30px;
      }
      .box2 {
        border: 2px solid black;
        margin:30px;
        width: 310px;
        height:240px;
      }
      .text{
        border: 2px solid black;
        height: 120px;
        width: 600px;
        border-radius: 30px;
        margin-left: 75px;
        margin-top: 40px;
      }
      .text > p{
        text-align: center;
        font-size: 40px;
        padding: 0px;
      }

      .circle{
        background-color: brown;
        border: 2px solid brown;
        border-radius: 100px;
        height: 20px;
        width: 20px;
        margin-left: 610px;
      }

      footer{
        background-color: rgb(226, 104, 226);
        text-align: center;
        margin-top:10px ;
      }

    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li>Home</li>
        <li>About Us</li>
        <li>Services</li>
        <li>Contact Us</li>
      </ul>
    </nav>
    
    <div class="box">
      <div class="box1"></div>
      <div class="box2"></div>
    </div>

    <div class="text">
      <div class="circle"></div>
      <p>Welcome to this Sigma Web Development Course </p>
    </div>

    <footer>
      All Rights Reserved @2025
    </footer>
  </body>
</html>
