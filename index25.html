<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        .box:first-child{
            background-color: red;
        }
        .box::first-line{
            color: yellow
        }
        .boxes *{
            color: blue;
            border: 2px solid black;
        }
        p, a, .box, [data-color="primary"]{
            padding-top: 45px;
        }
        
        .box:nth-child(even){
            background-color: blue;
        }
        .box:nth-last-child(1){
            background-color: red;
            
        }
        .boxes::before{
            content:"mansi is good";
            color: red;
        }
        .boxes::after{
            content:"mansi is not good";
            color: blue;
        }
            color: aqua;


        ::selection{
            background-color: black;
            color:red;

        }
        .box::first-letter{
            color: blueviolet;
            font-size: 45px;
        }
        input::placeholder{
            color: blue;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <div class="boxes">
        <div data-color="primary" class="box">hey i am a box</div>
        <div class="box">hey i am a box</div>
        <div class="box">hey i am a box</div>
        <input type="text" placeholder="type your name here">
    </div>
</body>
</html>
