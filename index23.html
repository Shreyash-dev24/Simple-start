<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <style>
    
    body{
      background-color: rgb(232, 227, 222);
    }
    .card{
      border: 2px solid white;
      height: 520px;
      width: 400px;
      margin:auto ;
      border-radius: 5px;
      background-color: aliceblue;
    }
    #img{
      height: 200px;
      width: 380px;
      border-radius:7px;
      margin-left:10px;
      margin-top: 10px;
    }
    .relate > h3{
      border: 1px solid black;
      margin-left: 20px;
      display: inline-block;
      border-radius: 25px;
      padding: 10px 10px;
      color: gray;
    }
     #readMore{
        
        background-color: rgb(131, 183, 213);
        text-align: center;
        color:rgb(0, 42, 255) ;
        margin-left: 140px;
     } 
   p{
    margin-left: 10px;
    
   }
   h1{
    margin:10px;
   }

  </style>
</head>
<body>
  <div class="card">
    <img src="card.jpg" alt="image" id="img">
    <div class="relate">
      <h3>Nature</h3>
      <h3>Lake</h3>
      <h1>Lago Di Braies</h1>
      <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nostrum voluptatum enim rem vero quas reiciendis similique tempore sequi officiis porro.</p>
      <h3 id="readMore">Read More</h3>
    </div>
  </div>
</body>
</html>
